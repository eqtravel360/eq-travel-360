<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EQ Travel 360 | by edgarquieltravel</title>
  
  <!-- Estilos del mapa (Leaflet) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-dark: #1e293b;
      --accent-blue: #0284c7;
      --text-bright: #38bdf8;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text-light);
    }

    /* Cabecera y Marca */
    header {
      background-color: var(--panel-dark);
      padding: 2rem 1rem 1.5rem 1rem;
      text-align: center;
      border-bottom: 3px solid var(--accent-blue);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .brand-logo {
      max-width: 180px;
      height: auto;
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
      transition: transform 0.3s ease;
    }

    .brand-logo:hover {
      transform: scale(1.05);
    }

    /* Barra de filtros de categoría */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 25px auto 10px auto;
      flex-wrap: wrap;
      padding: 0 10px;
    }

    .filter-btn {
      background: var(--panel-dark);
      border: 1px solid #334155;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent-blue);
      color: white;
      border-color: var(--text-bright);
    }

    /* Contenedor del Mapa */
    .map-section {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px;
    }

    #map {
      height: 520px;
      width: 100%;
      border-radius: 16px;
      border: 2px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    /* Popups dentro del mapa */
    .leaflet-popup-content-wrapper {
      background: var(--panel-dark) !important;
      color: var(--text-light) !important;
      border-radius: 8px;
      border: 1px solid var(--accent-blue);
    }
    .leaflet-popup-tip {
      background: var(--panel-dark) !important;
    }
    .popup-btn {
      display: inline-block;
      margin-top: 10px;
      background: var(--accent-blue);
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Encabezado con el Logo -->
  <header>
    <img src="logo.jpg.png" alt="EQ Travel 360 Logo" class="brand-logo">
  </header>

  <!-- Filtros Rápidos -->
  <div class="filter-bar">
    <button class="filter-btn active">Todos los Destinos</button>
    <button class="filter-btn">Naturaleza & Senderismo</button>
    <button class="filter-btn">Cultura & Ciudad</button>
    <button class="filter-btn">Rutas 360°</button>
  </div>

  <!-- Sección del Mapa -->
  <div class="map-section">
    <div id="map"></div>
  </div>

  <!-- Scripts del Mapa -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([10, -20], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap | EQ Travel 360'
    }).addTo(map);

    const bitacoras = [
      {
        titulo: "Río de Janeiro",
        coords: [-22.9068, -43.1729],
        resumen: "Vistas panorámicas desde el Corcovado y energía en Copacabana.",
        link: "#"
      },
      {
        titulo: "San Pedro de Atacama",
        coords: [-22.9087, -68.1997],
        resumen: "Atardeceres desérticos, géiseres y volcanes.",
        link: "#"
      }
    ];

    bitacoras.forEach(lugar => {
      L.marker(lugar.coords).addTo(map)
        .bindPopup(`
          <strong style="color: #38bdf8; font-size: 1.1rem;">${lugar.titulo}</strong>
          <p style="margin: 5px 0; font-size: 0.85rem; color: #cbd5e1;">${lugar.resumen}</p>
          <a href="${lugar.link}" class="popup-btn">Explorar Bitácora 360°</a>
        `);
    });
  </script>
</body>
</html>
