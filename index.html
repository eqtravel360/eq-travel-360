<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EQ Travel 360 | by edgarquieltravel</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg-dark: #0b1329;
      --panel-dark: #1e293b;
      --accent-blue: #0284c7;
      --text-bright: #38bdf8;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --gold-accent: #f59e0b;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text-light);
    }

    /* ENCABEZADO CON LOGOS MÁS GRANDES */
    header {
      background: linear-gradient(135deg, #020617 0%, #0369a1 50%, #0f172a 100%);
      padding: 2.5rem 1rem;
      border-bottom: 4px solid var(--text-bright);
      box-shadow: 0 10px 35px rgba(2, 132, 199, 0.4);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(#38bdf8 1.5px, transparent 1.5px);
      background-size: 30px 30px;
      opacity: 0.12;
      pointer-events: none;
    }

    .header-container {
      max-width: 1150px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 25px;
      position: relative;
      z-index: 1;
    }

    /* TARJETA CON ÍCONOS AMPLIADOS */
    .tattoo-header-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 18px;
      padding: 18px 24px;
      min-width: 280px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.25);
    }

    .vector-monuments-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      border-bottom: 1px dashed rgba(56, 189, 248, 0.3);
      padding-bottom: 12px;
    }

    /* Íconos vectoriales pasados a 38px */
    .svg-icon {
      width: 38px;
      height: 38px;
      fill: none;
      stroke: var(--text-bright);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px var(--text-bright));
    }

    .tattoo-flight-path {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .flight-dots {
      width: 45px;
      height: 2px;
      background: repeating-linear-gradient(90deg, var(--text-bright) 0 4px, transparent 4px 8px);
    }

    .plane-svg {
      width: 32px;
      height: 32px;
      fill: var(--text-bright);
      transform: rotate(45deg);
      filter: drop-shadow(0 0 6px var(--text-bright));
      animation: planeHover 3s ease-in-out infinite alternate;
    }

    @keyframes planeHover {
      0% { transform: rotate(45deg) translateY(0px); }
      100% { transform: rotate(45deg) translateY(-5px); }
    }

    .tattoo-header-card h4 {
      margin: 0;
      color: var(--text-bright);
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .tattoo-header-card p {
      margin: 5px 0 0 0;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    /* LOGO CENTRAL AMPLIADO A 260PX */
    .logo-center {
      text-align: center;
    }

    .brand-logo {
      max-width: 260px; /* Tamaño significativamente mayor */
      height: auto;
      border-radius: 50%;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.9);
      transition: transform 0.3s ease;
    }

    .brand-logo:hover {
      transform: scale(1.05) rotate(2deg);
    }

    /* SELLO AMPLIADO A 150PX */
    .stamp-badge-large {
      border: 3px double var(--gold-accent);
      border-radius: 50%;
      width: 150px;
      height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: rotate(-6deg);
      background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, rgba(15, 23, 42, 0.9) 100%);
      color: var(--gold-accent);
      text-align: center;
      font-weight: bold;
      font-size: 0.88rem;
      text-transform: uppercase;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
      transition: transform 0.3s ease;
    }

    .stamp-badge-large:hover {
      transform: rotate(0deg) scale(1.05);
    }

    .stamp-star {
      font-size: 1.4rem;
      margin: 2px 0;
      display: inline-block;
      animation: spinStar 10s linear infinite;
    }

    @keyframes spinStar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .controls-container {
      max-width: 1100px;
      margin: 25px auto 10px auto;
      padding: 0 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 18px;
      border-radius: 25px;
      border: 1px solid #334155;
      background: var(--panel-dark);
      color: white;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--panel-dark);
      border: 1px solid #334155;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent-blue);
      color: white;
      border-color: var(--text-bright);
    }

    .map-section {
      max-width: 1100px;
      margin: 15px auto;
      padding: 0 15px;
    }

    #map {
      height: 500px;
      width: 100%;
      border-radius: 16px;
      border: 2px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .social-banner {
      max-width: 1100px;
      margin: 35px auto 10px auto;
      padding: 20px;
      background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid var(--accent-blue);
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .social-info h3 {
      margin: 0 0 5px 0;
      color: var(--text-bright);
      font-size: 1.2rem;
    }

    .social-info p {
      margin: 0;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .social-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .social-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.85rem;
      color: white;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .social-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .btn-youtube { background: #ef4444; }
    .btn-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
